<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t">
  <title id="t">Two matching frames: a bright posted photo, and a dim room with one small light linked by a long thread to a warm light far away</title>
  <!--
    "Homesick, broke, and alone: the version of studying abroad no one posts about."
    The post is about the gap between how it looks and how it feels. So: two
    frames of exactly the same size, the same week. The left one is the photo
    that got posted — a sun, a horizon, nothing wrong. The right one is the room
    it was posted from: dark, one small light on, and a thread running out of
    the frame to a warm light a long way off. Home is still lit. It is far.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ed"/>
      <stop offset="100%" stop-color="#eee6d9"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c17f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c17f5e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .home   { animation: glow 6s ease-in-out infinite; transform-origin: 1066px 150px; }
      .lamp   { animation: glow 6s ease-in-out infinite -3s; transform-origin: 720px 420px; }
      .thread { animation: flow 3s linear infinite; }
      @keyframes glow {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.08); }
      }
      /* The dash pattern is 6 + 14 = 20 units, so shifting by 20 loops seamlessly. */
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) {
        .home, .lamp, .thread { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#ground)"/>

  <!-- How it looks: the photo that got posted. -->
  <rect x="170" y="170" width="320" height="320" rx="18" fill="#fbf8f3" stroke="#2c3a2e" stroke-width="5"/>
  <circle cx="395" cy="262" r="36" fill="#c17f5e" fill-opacity="0.85"/>
  <path d="M172 410c60-34 112-34 168-10s112 26 148-6" fill="none" stroke="#8a9e8c" stroke-width="6" stroke-linecap="round"/>
  <path d="M172 448c70-22 150-22 316-4" fill="none" stroke="#8a9e8c" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="548" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" fill="#2c3a2e" opacity="0.6">how it looks</text>

  <!-- How it feels: the same frame, the room it was posted from. -->
  <rect x="610" y="170" width="320" height="320" rx="18" fill="#2c3a2e" stroke="#2c3a2e" stroke-width="5"/>
  <g class="lamp"><circle cx="720" cy="420" r="44" fill="url(#warm)"/></g>
  <circle cx="720" cy="420" r="9" fill="#c17f5e"/>
  <text x="770" y="548" text-anchor="middle" font-family="Georgia, serif"
        font-size="26" fill="#2c3a2e" opacity="0.6">how it feels</text>

  <!-- The thread home: out of the room, a long way, still connected. -->
  <path class="thread" d="M720 420C800 360 860 250 930 214S1020 160 1066 150"
        fill="none" stroke="#c17f5e" stroke-opacity="0.8" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="6 14"/>
  <g class="home"><circle cx="1066" cy="150" r="64" fill="url(#warm)"/></g>
  <circle cx="1066" cy="150" r="14" fill="#c17f5e"/>
</svg>
