<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t">
  <title id="t">Identical chat bubbles that keep resetting beside a single line threading through three points over time</title>
  <!--
    "ChatGPT vs a therapist."
    The post's argument is about continuity, so the picture is about continuity.
    Left: three identical bubbles that appear, then clear, then appear again —
    always answering, always starting from nothing. Right: one line drawn once,
    passing through three points and holding them together, each larger than
    the last. Same subject, two different relationships with time.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f3ed"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>
    <style>
      .b1 { animation: surface 7s ease-in-out infinite; }
      .b2 { animation: surface 7s ease-in-out infinite -0.5s; }
      .b3 { animation: surface 7s ease-in-out infinite -1s; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .thread { stroke-dasharray: 470; stroke-dashoffset: 470; animation: draw 7s ease-in-out infinite; }
      .n1 { animation: land 7s ease-out infinite 1.4s; }
      .n2 { animation: land 7s ease-out infinite 2.6s; }
      .n3 { animation: land 7s ease-out infinite 3.8s; }
      /* Fills, then clears completely — the reset is the point. */
      @keyframes surface {
        0%, 6%    { opacity: 0; }
        16%, 62%  { opacity: 1; }
        72%, 100% { opacity: 0; }
      }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes draw {
        0%        { stroke-dashoffset: 470; }
        62%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes land {
        0%, 4%    { opacity: 0; transform: scale(0.4); }
        14%, 100% { opacity: 1; transform: scale(1); }
      }
      .n1 { transform-origin: 700px 470px; }
      .n2 { transform-origin: 850px 380px; }
      .n3 { transform-origin: 1010px 250px; }
      @media (prefers-reduced-motion: reduce) {
        .b1, .b2, .b3, .caret, .n1, .n2, .n3 { animation: none; opacity: 1; transform: none; }
        .thread { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#ground)"/>

  <!-- Left: the same exchange, endlessly available, endlessly starting over.
       Tails alternate sides so it reads as a conversation rather than a list. -->
  <g fill="none" stroke="#2c3a2e" stroke-width="5" stroke-opacity="0.75" stroke-linejoin="round">
    <g class="b1">
      <rect x="216" y="186" width="230" height="66" rx="20"/>
      <path d="M244 252l-16 22 44-22"/>
    </g>
    <g class="b2">
      <rect x="266" y="286" width="230" height="66" rx="20"/>
      <path d="M468 352l16 22-44-22"/>
    </g>
    <g class="b3">
      <rect x="216" y="386" width="230" height="66" rx="20"/>
      <path d="M244 452l-16 22 44-22"/>
    </g>
  </g>

  <!-- The empty box it always returns to. -->
  <rect x="216" y="496" width="230" height="44" rx="14" fill="none" stroke="#8a9e8c"
        stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 8"/>
  <rect class="caret" x="240" y="507" width="5" height="22" rx="2" fill="#c17f5e"/>
  <text x="356" y="602" text-anchor="middle" font-family="Georgia, serif"
        font-size="27" fill="#2c3a2e" opacity="0.62">starts over</text>

  <!-- Right: one line, drawn once, holding what came before. -->
  <path class="thread" d="M700 470C770 470 780 390 850 380C920 370 930 290 1010 250"
        fill="none" stroke="#c17f5e" stroke-width="7" stroke-linecap="round"
        vector-effect="non-scaling-stroke"/>
  <circle class="n1" cx="700" cy="470" r="9" fill="#8a9e8c"/>
  <circle class="n2" cx="850" cy="380" r="12" fill="#8a9e8c"/>
  <circle class="n3" cx="1010" cy="250" r="16" fill="#2c3a2e"/>
  <text x="860" y="602" text-anchor="middle" font-family="Georgia, serif"
        font-size="27" fill="#2c3a2e" opacity="0.62">remembers</text>

  <line x1="600" y1="170" x2="600" y2="540" stroke="#8a9e8c" stroke-opacity="0.28"
        stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
