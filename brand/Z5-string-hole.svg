<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="384" viewBox="0 0 1024 384" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The String-Hole</title>
  <desc>A pothi page. Palm-leaf manuscripts are never bound: the leaves are separate, and a hole is burnt through each one so that a single cord can pass through and hold the loose days together. The scribes wrote around that hole — the writing breaks for it and closes again on the other side, leaving a clear round space in the middle of the text. The cord, seen end-on through the hole, is the dot.</desc>
