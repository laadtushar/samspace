<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Unwinding</title>
  <desc>One unbroken line, and the family gesture run backwards. The Thread ends by winding in; this one begins wound and comes undone. It starts at the dead centre of a tight coil, and every turn is wider than the one before it, so the spiral accelerates instead of settling; the last turn does not close, it leaves, and the thread runs away across an empty field and simply stops. Nothing is cut and nothing is added — the same length of thread, unwound. The mark ends on a bare open end, which is the point: the held thing is let out. One path, one M, no second M.</desc>
