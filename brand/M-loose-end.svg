<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Loose End</title>
  <desc>One unbroken line. A free end rises into a loop drawn once around itself, crosses, and is let go: the tail runs away down through empty space and stops in a small open curl. The opposite resolution to The Thread — released rather than wound. One path, one M, no second M.</desc>
