<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Thread</title>
  <desc>One unbroken line. A loose tangle on the left lets one thread go; it crosses a wide empty middle and winds into a close, still spiral on the right. Nothing is cut and nothing is added — it is the same length of thread, wound. The masses are deliberately unequal and the space between them is most of the mark. One path, one M, no second M.</desc>
