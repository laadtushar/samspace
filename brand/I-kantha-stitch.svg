  <title>Samvriti.Space — Kantha</title>
  <desc>Not an icon but a rhythm. Running stitch — kantha — crossing the seam where two
  cloths are joined: the mend is allowed to show. It repeats without end as a border, a
  divider or a ground; one stitch was added later, in a different thread, off-centre.</desc>
