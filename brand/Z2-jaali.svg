  <title>Samvriti.Space — Jaali</title>
  <desc>A pierced screen, cut in the plain octagon-and-square jaali. A jaali passes the air and the light and holds the detail back; it was made so that someone could look out without being looked at. Every opening here is the same size; one of them has the light behind it.</desc>
