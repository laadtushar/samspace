<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Between Two (favicon cut)</title>
  <desc>The right-hand half of the full mark, kept whole — the second figure, the run, and the coil. Two profiles do not survive this weight: at 34-46 the two noses meet and the pair reads as one animal head, so the icon drops the first figure rather than thinning the stroke. The profile is cut to seven inflections and the coil to a single turn, and the coil stays OUTSIDE the skull, which is this direction's whole claim. One path, one M.</desc>
