<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Taana-Baana</title>
  <desc>Warp and weft. The taana is strung once and stands under tension for the whole length of the cloth; the baana is a single thread carried across it, turned at the selvedge, carried back. Plain weave, over one and under one, drawn honestly — the weft is one continuous path and the warp is redrawn over it at every crossing where it passes behind. Five passes are finished. The sixth stops part way, which is where the work is.</desc>
