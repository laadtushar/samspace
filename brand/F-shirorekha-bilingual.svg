<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="368" viewBox="0 0 1260 368" role="img" aria-label="samvriti.space — संवृति">
  <title>Samvriti.Space — Shirorekha (bilingual lockup)</title>
  <desc>Latin letters stand on a baseline; Devanagari hangs from the shirorekha above it.
  Here one clay line does both jobs and runs past both words. Devanagari set in FreeSerif
  (no Cormorant Devanagari exists); the i-matra was reordered into visual position by hand.</desc>
