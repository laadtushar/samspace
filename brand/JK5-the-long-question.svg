<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Long Question</title>
  <desc>One unbroken line that does two jobs. It begins as a ruled line — the line you write on, the line under a sentence — and runs level and almost empty across three quarters of the mark; then it lifts off the rule and turns into the hook of a question, over the top and down; and where a question mark puts a separate dot, this line does not lift. It carries on down and winds into a close, still spiral. The rule, the question and the point are the same stroke. For a practice that is half therapy and half academic mentoring, the tool in both halves is the same: a question that does not end in a full stop. One path, one M, no second M.</desc>
