<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — S monogram, filled tile</title>
  <rect width="512" height="512" rx="128" fill="#2c3a2e"/>
  <title>Samvriti.Space — S monogram</title>
  <!-- One continuous S built from two equal turns that hand off mid-stroke:
       sam, "together". Two movements, one letter. -->
