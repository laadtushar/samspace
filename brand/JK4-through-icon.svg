  <title>Samvriti.Space — Through (favicon cut)</title>
  <desc>The same construction, heavy: the wind-in cut from two and a quarter turns to one and a third, the centre opened from eleven units to twenty-six so the two passes stay apart instead of filling solid, and the runs cut to what a 32px square holds. Both tails kept — a coil with one tail is a different mark. Reduced, not thickened. One path, one M.</desc>
