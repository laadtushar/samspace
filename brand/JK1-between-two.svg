<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Between Two</title>
  <desc>One unbroken line draws two people and the thing between them. It begins as a loose end at the first figure's nape, runs up the back of the head, over the crown, down forehead, brow, nose, lip and chin to the throat — and there, instead of stopping, it carries on across the low gap and rises as the second figure's throat, so the second person is the first person's own line, continued. Up that face, over that crown, down the back; then the line leaves the body altogether, crosses a wide empty field and winds into a close, still spiral that belongs to neither of them. Both heads are left open at the back; the coil is the only thing that is finished. One path, one M, no second M.</desc>
