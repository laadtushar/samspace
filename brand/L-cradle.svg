<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Cradle</title>
  <desc>TWO strokes, not one — this direction does not claim a single line. Stroke one is the hand: wrist, heel, cupped palm, three fingers curling back over the palm, thumb laid across the front, one continuous line, open at the wrist. Stroke two is what it holds: a wound spiral in clay, the only warm thing in the system. For a one-colour setting, set the clay stroke to forest and nothing else changes.</desc>
