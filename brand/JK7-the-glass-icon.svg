<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Glass (favicon cut)</title>
  <desc>The same construction, reduced: the glass moved down into the corner, the steam cut from two waves to half of one and turned so that it peels off the rim sideways — kept vertical it merges with the wall and the glass stops reading as a vessel — and the curl cut from two and a third turns to nine tenths of one with its inner radius opened from eight units to forty. At the drawn setting the steam thins to nothing and the curl fills to a dot under this weight. Reduced, not thickened. One path, one M, no Z.</desc>
