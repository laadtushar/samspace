<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Through</title>
  <desc>One unbroken line, and a deliberate refusal of the family ending. The Thread and Profile both stop wound; this one does not. The line runs in level from the left, dips off its own course and winds inward through more than two turns to a tight centre — and then, without reversing and without lifting, keeps turning the same way while the radius grows again, so it comes back out between its own turns, crosses its own rim, and goes on to the right a little lower than it came in. The coil is in the middle of the line, not at its end: the tight place is somewhere the thread went through, not somewhere it stayed. One path, one M, no second M.</desc>
