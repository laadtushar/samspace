<svg xmlns="http://www.w3.org/2000/svg" width="1387" height="361" viewBox="0 0 1387 361" role="img" aria-label="samvriti.space">
  <title>Samvriti.Space — Wordmark (the space is the mark)</title>
  <desc>Lettering-led. The practice is called .space, so the wordmark is made of space:
  the tracking is the mark. Three clay dots — the two i tittles and the period — set the
  rhythm and are the only warm things in it.</desc>
