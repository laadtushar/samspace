<svg xmlns="http://www.w3.org/2000/svg" width="448" height="768" viewBox="0 0 448 768" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Pin</title>
  <desc>One unbroken length of wire. It begins as the point, runs down the long shaft, wraps once and a half into the spring at the foot, comes back up the other arm and ends by closing the cap over the point it started as — near it, not touching it. This is the one sibling that refuses the family spiral: the turn at the foot does not tighten to a still centre and the line does not come to rest in it. It is a working coil, held under tension, and the tension is the only reason the thing holds at all. A safety pin is what an Indian household actually repairs itself with — a sari pleat, a strap, a hem, a fortnight before the tailor. One path, one M, no Z.</desc>
