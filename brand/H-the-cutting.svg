<svg xmlns="http://www.w3.org/2000/svg" width="442" height="600" viewBox="0 0 442 600" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Cutting</title>
  <desc>A money-plant cutting rooting in a glass of water, drawn by hand. Everything keeping
  the leaves alive is happening below the waterline where no one is looking, and it takes weeks.
  Figurative, portrait, off-centre: the plant leans out of frame to the right.</desc>
