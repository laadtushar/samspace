<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Point (favicon cut)</title>
  <desc>The same construction, reduced: the shaft shortened and thickened in proportion, and the coil cut from two and a half turns to seven tenths of one with its inner radius opened from eight units to thirty-six, so it stays an open curl instead of closing into a solid ring — at this weight a closed ring reads as the bowl of a spoon. Reduced, not thickened. One path, one M, no Z.</desc>
