<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Whorl (favicon cut)</title>
  <desc>The same construction, reduced: the pad fills the square, the ridge cut from three and a half turns to a single one, and its inner radius opened from nine units to fifty-two so the centre stays a hole at thirty-two pixels instead of filling to a dot. The delta is opened out into one wide sweep rather than a narrow slot, which closes up solid at this weight. Reduced, not thickened. One path, one M, no Z.</desc>
