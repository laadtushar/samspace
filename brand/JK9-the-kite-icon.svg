<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Kite (favicon cut)</title>
  <desc>The same circuit, reduced: the kite enlarged and widened to fill the square, the string cut to a stub, and the reel cut from two and a third turns to four fifths of one with its inner radius opened from eight units to forty. The spine is kept — without it the diamond reads as a leaf. Reduced, not thickened. One path, one M, no Z.</desc>
