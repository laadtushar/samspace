<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Pin (favicon cut)</title>
  <desc>The same wire, squared up and shortened: the shaft cut from roughly three times the width of the spring to one and a half, the spring opened from a turn and a half to a turn and a tenth at radius seventy, and the cap simplified to a single hook. At the drawn setting the two passes of the spring merge into a solid ring under this weight and stop being a coil. Reduced, not thickened. One path, one M, no Z.</desc>
