<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Caret</title>
  <desc>The proofreader's caret — Latin caret, "it lacks". SEVEN strokes: four faint sage rules that
  make it a page, one forest rule broken off-centre, and the clay caret pointing up into the break.
  The two halves of the broken rule are deliberately unequal; symmetrical they read as a face.</desc>
  <rect width="512" height="512" fill="#f7f3ed"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 136L424 136" stroke="#8a9e8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 196L424 196" stroke="#8a9e8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 316L424 316" stroke="#8a9e8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 376L424 376" stroke="#8a9e8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 256L238 256" stroke="#2c3a2e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M322 256L424 256" stroke="#2c3a2e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M236 318L280 248L324 318" stroke="#c17f5e" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
