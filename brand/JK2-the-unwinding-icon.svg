<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Unwinding (favicon cut)</title>
  <desc>The same gesture, heavy. The coil is cut from two and a half turns to one and a third and its inner radius raised to twenty units, because a fine coil fills solid under this weight and stops being a coil; the run is shortened to what a 32px square can hold. Reduced, not thickened. One path, one M.</desc>
