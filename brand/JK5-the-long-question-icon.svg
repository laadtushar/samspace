<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Long Question (favicon cut)</title>
  <desc>The right-hand end of the mark, kept whole: the rule cut back to a stub and the hook enlarged to fill the square. The point is reduced from two and a fifth turns to under one and its inner radius opened from six units to twenty-nine — at the drawn setting it fills to a solid dot under this weight and stops being a coil. Reduced, not thickened. One path, one M.</desc>
