<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Overprint</title>
  <desc>Two inked forms laid over one another on paper, slightly out of register. The smaller
  is mostly held inside the larger and deliberately breaks its edge at the top right: held,
  not contained. Only the overlap prints dark — the session is the overlap, not either person.
  Riso texture, off-centre, bleeds off all four edges.</desc>
