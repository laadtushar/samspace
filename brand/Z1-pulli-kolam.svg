<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Pulli Kolam</title>
  <desc>A sikku (knot) kolam. The pulli — the dots — are set down first and never move; one line is then 
  taken around them without lifting and without ever touching one, and it must return to where it began. 
  Drawn here by the mirror-curve construction on a 3x4 grid, so the line is genuinely single and genuinely closed: 
  one path, one M. The dots are the given; the line is the only thing with any choice in it.</desc>
