<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Profile</title>
  <desc>One unbroken line: throat, chin, lip, nose, brow, forehead, crown, down behind the ear, then it hooks inward at the nape and coils twice inside the head. The contour and the thing held inside it are the same stroke — in the reference marks they are always two separate drawings. Open at the throat; it never closes. One path, one M, no second M.</desc>
