<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Not Yet Pulled (favicon cut)</title>
  <desc>The knot alone, at the largest size the square holds, with the bare runs cut to stubs and the terminal coil dropped — the three crossings are the subject and nothing else fits beside them. This is the tightest cut that keeps all three: opened any further along its own parameter the two lower crossings vanish and it becomes a single loop, and left any denser the lower lobes fill solid under a 34-unit stroke. Reduced, not thickened; this cut gives up the spiral rather than give up the crossings. One path, one M.</desc>
