<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — The Point</title>
  <desc>One unbroken line draws a pencil and the mark it has just made, and they are the same line. It starts short of the tip on one side of the sharpened cone, runs up that edge and the length of the shaft, across the blunt end, back down the other side to the point — and out of the point it keeps going as graphite, runs a little way clear, and winds into a close, still coil. The instrument and its trace are one stroke, which is the honest shape of the mentoring half of this practice: the tool is not separate from what it leaves behind. Open at the tip. One path, one M, no Z.</desc>
