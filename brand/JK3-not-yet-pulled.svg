<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Not Yet Pulled</title>
  <desc>One unbroken line. A thread comes in bare from the left, and near the middle it crosses itself three times — an overhand knot, drawn open, never pulled. The crossings are the subject: this is not a tangle and not a mass, it is three decisions, and the same thread runs straight out the other side and winds into a close, still spiral. Nothing is cut; the knot can still be undone from either end. The bare run on both sides of it is most of the mark. One path, one M, no second M.</desc>
