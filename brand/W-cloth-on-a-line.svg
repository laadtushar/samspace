<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Samvriti.Space">
  <title>Samvriti.Space — Cloth on a Line</title>
  <desc>A length of cloth hung over a line: one side swung out by the air, one side hanging straight, a woven border across it and a wavy hem. Its four structural strokes — line, border, straight fall, swung edge — are the Devanagari letter स.</desc>
